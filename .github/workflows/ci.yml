name: CI

# The live suite drives a real Excel instance and cannot run on a hosted
# runner, so CI covers the static gate: pinned pyvbaanalysis over every
# VBA source, with zero findings in ReDim's own. The olevba and mraptor
# scan runs in security.yml. The live suite stays a local step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ReDim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The analyzer resolves cross-module references against the runtime,
      # which lives in its own repository beside this one. The ref is the
      # ROneCOne release ReDim ships and is tested against, not its main.
      - name: Check out ROneCOne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WilliamSmithEdward/ROneCOne
          ref: a84b5719e443c50d02575a50a645531d0c3a7858 # v1.10.1
          path: .ronecone

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      # Only the analyzer: requirements-dev.txt also pulls the live-Excel
      # harness, which has no meaning on a Linux runner. Keep the analyzer
      # version aligned with requirements-dev.txt and update it deliberately.
      - name: Install the analyzer
        run: pip install pyvbaanalysis==2.3.1

      - name: Run the static gate
        env:
          REDIM_RONECONE_PATH: ${{ github.workspace }}/.ronecone/src/ROneCOne.cls
        run: python tools/check.py

  ci-passed:
    name: CI passed
    if: always()
    needs: [static-analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
