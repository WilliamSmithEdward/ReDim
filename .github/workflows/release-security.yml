name: Release security report

# Each published release gets the security scan's report on its own assets:
# every workbook and source file, their SHA-256 hashes, olevba's and
# mraptor's findings with the reason for each, YARA-X and ClamAV matches,
# and the p-code check. Reviewed findings are judged by
# tools/security_expected.json at the release tag. The report is
# attached to the release as <tag>-security-report.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to report on, such as v1.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-security-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release-report:
    name: Attach release report
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install the scanner
        run: pip install --require-hashes -r .github/requirements/release.txt

      - name: Fetch checksum-pinned YARA Forge rules
        run: python tools/yara_forge.py fetch

      # The engine is the image pinned in .github/security/clamav, which
      # Dependabot follows. freshclam fetches and verifies today's signatures
      # into the volume the clamscan shim reads.
      - name: Install ClamAV and current signatures
        run: |
          docker build --quiet --tag clamav-pinned .github/security/clamav
          docker run --rm --entrypoint freshclam --volume clamav-db:/var/lib/clamav clamav-pinned --stdout
          echo "$GITHUB_WORKSPACE/.github/security/clamav" >> "$GITHUB_PATH"
          .github/security/clamav/clamscan --version

      # Assets can land after the release is published. Wait until the
      # runtime files and a workbook are there and two looks 30 seconds
      # apart see the same list.
      - name: Wait for the release's assets
        run: |
          previous=""
          for attempt in $(seq 1 30); do
            names=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq '.assets[].name' | sort)
            if printf '%s\n' "$names" | grep -qx 'ReDimUI.cls' \
              && printf '%s\n' "$names" | grep -qx 'ReDimHost.bas' \
              && printf '%s\n' "$names" | grep -q '\.xlsm$' \
              && [ "$names" = "$previous" ]; then
              printf '%s\n' "$names"
              exit 0
            fi
            previous=$names
            sleep 30
          done
          echo "The release's assets did not settle within 15 minutes." >&2
          exit 1

      - name: Download the release assets
        run: >-
          gh release download "$TAG" --dir release-assets
          --pattern '*.xlsm' --pattern '*.cls' --pattern '*.bas'

      # The report goes up even when the scan finds something unexpected;
      # the run then fails, so the finding is seen.
      - name: Write and attach the report
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          report="release-assets/$TAG-security-report.md"
          status=0
          python tools/security_scan.py --clamav \
            --forge-rules build/yara-forge/core.yar --report "$report" \
            --title "Security report for ReDim $TAG" \
            release-assets/*.xlsm release-assets/*.cls release-assets/*.bas || status=$?
          test -f "$report"
          gh release upload "$TAG" "$report" --clobber
          exit "$status"
