name: Security

# olevba, mraptor and the p-code check over the runtime files and freshly
# built demo workbooks. ClamAV and YARA-X run in malware-scan.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *' # Daily UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macros:
    name: olevba and mraptor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: WilliamSmithEdward/ROneCOne
          ref: a84b5719e443c50d02575a50a645531d0c3a7858 # v1.10.1
          path: .ronecone
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install scanner and workbook builder
        run: pip install oletools==0.60.2 pyopenvba==6.3.2
      - name: Build demo workbooks
        env:
          REDIM_RONECONE_PATH: ${{ github.workspace }}/.ronecone/src/ROneCOne.cls
        run: python tools/build_workbooks.py
      - name: Scan macros and p-code
        run: >-
          python tools/security_scan.py --strict --macro-only --report macro-report.md
          src/ReDimUI.cls src/ReDimHost.bas .ronecone/src/ROneCOne.cls demo/*.xlsm
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macro-report
          path: macro-report.md
          if-no-files-found: ignore

  security-passed:
    name: Security passed
    if: always()
    needs: [macros]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
