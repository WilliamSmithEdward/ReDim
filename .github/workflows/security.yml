name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *' # Daily UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macro:
    name: olevba, mraptor, and p-code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: WilliamSmithEdward/ROneCOne
          ref: a84b5719e443c50d02575a50a645531d0c3a7858 # v1.10.1
          path: .ronecone
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install scanner and workbook builder
        run: pip install oletools==0.60.2 pyopenvba==6.3.2
      - name: Build demo workbooks
        env:
          REDIM_RONECONE_PATH: ${{ github.workspace }}/.ronecone/src/ROneCOne.cls
        run: python tools/build_workbooks.py
      - name: Scan macros and p-code
        run: >-
          python tools/security_scan.py --strict --macro-only --report macro-report.md
          src/ReDimUI.cls src/ReDimHost.bas .ronecone/src/ROneCOne.cls demo/*.xlsm
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macro-report
          path: macro-report.md
          if-no-files-found: ignore

  yara:
    name: YARA-X (VBA and YARA Forge)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: WilliamSmithEdward/ROneCOne
          ref: a84b5719e443c50d02575a50a645531d0c3a7858 # v1.10.1
          path: .ronecone
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install scanner and workbook builder
        run: pip install oletools==0.60.2 pyopenvba==6.3.2 yara-x==1.20.0
      - name: Check YARA-X rules and pin handling
        run: python -m unittest discover -s tests/python -p 'test_yara_rules.py'
      - name: Fetch checksum-pinned YARA Forge rules
        run: python tools/yara_forge.py fetch
      - name: Build demo workbooks
        env:
          REDIM_RONECONE_PATH: ${{ github.workspace }}/.ronecone/src/ROneCOne.cls
        run: python tools/build_workbooks.py
      - name: Scan raw files and VBA
        run: >-
          python tools/security_scan.py --strict --yara-only
          --forge-rules build/yara-forge/core.yar --report yara-report.md
          src/ReDimUI.cls src/ReDimHost.bas .ronecone/src/ROneCOne.cls demo/*.xlsm
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yara-report
          path: yara-report.md
          if-no-files-found: ignore

  clamav:
    name: ClamAV (current official signatures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: WilliamSmithEdward/ROneCOne
          ref: a84b5719e443c50d02575a50a645531d0c3a7858 # v1.10.1
          path: .ronecone
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install scanner and workbook builder
        run: pip install oletools==0.60.2 pyopenvba==6.3.2
      - name: Check ClamAV finding handling
        run: python -m unittest discover -s tests/python -p 'test_clamav_scan.py'
      - name: Update ClamAV signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
      - name: Build demo workbooks
        env:
          REDIM_RONECONE_PATH: ${{ github.workspace }}/.ronecone/src/ROneCOne.cls
        run: python tools/build_workbooks.py
      - name: Scan raw files and VBA
        run: >-
          python tools/security_scan.py --strict --clamav-only --report clamav-report.md
          src/ReDimUI.cls src/ReDimHost.bas .ronecone/src/ROneCOne.cls demo/*.xlsm
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clamav-report
          path: clamav-report.md
          if-no-files-found: ignore
