name: security-report

# Scans a release's published workbooks and source files with olevba and
# attaches the report to the release, as ReDim_X.Y.Z_Security_Report.md.
# Runs when a release is published, and on demand for a tag. The scanner
# and its list of expected findings come from the tagged commit, so the
# report judges the release by its own rules.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan, such as v1.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: security-report-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the scanner
        run: pip install oletools==0.60.2

      # Assets can land after the release is published. Wait until the
      # runtime files and a workbook are there and two looks 30 seconds
      # apart see the same list.
      - name: Wait for the release's assets
        run: |
          previous=""
          for attempt in $(seq 1 30); do
            names=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.assets[].name' | sort)
            if printf '%s\n' "$names" | grep -qx 'ReDimUI.cls' \
              && printf '%s\n' "$names" | grep -qx 'ReDimHost.bas' \
              && printf '%s\n' "$names" | grep -q '\.xlsm$' \
              && [ "$names" = "$previous" ]; then
              printf '%s\n' "$names"
              exit 0
            fi
            previous=$names
            sleep 30
          done
          echo "The release's assets did not settle within 15 minutes." >&2
          exit 1

      - name: Download the assets
        run: >-
          gh release download "$TAG" --dir assets
          --pattern '*.xlsm' --pattern '*.cls' --pattern '*.bas'

      # The report goes up even when the scan finds something unexpected;
      # the run then fails, so the finding is seen.
      - name: Scan and attach the report
        run: |
          version="${TAG#v}"
          report="ReDim_${version}_Security_Report.md"
          status=0
          python tools/security_scan.py --report "$report" \
            --title "ReDim $version security report" assets/* || status=$?
          test -f "$report"
          gh release upload "$TAG" "$report" --clobber
          exit "$status"
